[project]
name = "chiketi"
version = "0.1.0"
description = "System stats dashboard with panel and vintage themes"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12.0"]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
chiketi = "chiketi.__main__:main"

[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = {include = ["chiketi", "chiketi.*"]}

[tool.setuptools.package-data]
chiketi = ["assets/**/*"]

# Tests are a development concern: run them from the repo, not from a release
# artifact. Without this (plus the `prune tests` in MANIFEST.in) setuptools
# auto-includes top-level tests/ in the sdist -- but only the test_*.py files,
# leaving out conftest.py, __init__.py and tests/fixtures/, so the shipped
# suite could not run at all.
[tool.setuptools.exclude-package-data]
"*" = ["tests", "tests.*"]

[tool.pytest.ini_options]
# Only collect the real test suite; scripts/ holds standalone tools like
# font_test.py (a pygame harness) that match pytest's *_test.py glob but
# aren't tests and pull in non-dev deps.
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Imports must follow the sys.path.insert that makes `chiketi` importable.
"scripts/gen_site_assets.py" = ["E402"]
