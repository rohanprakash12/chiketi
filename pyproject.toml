[project]
name = "chiketi"
version = "0.1.0"
description = "System stats dashboard with panel and vintage themes"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12.0"]
dev = ["pytest>=7.0"]

[project.scripts]
chiketi = "chiketi.__main__:main"

[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = {include = ["chiketi", "chiketi.*"]}

[tool.setuptools.package-data]
chiketi = ["assets/**/*"]
