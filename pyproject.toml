[project]
name = "chiketi"
version = "0.1.0"
description = "System stats dashboard with panel and vintage themes"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12.0"]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
chiketi = "chiketi.__main__:main"

[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = {include = ["chiketi", "chiketi.*"]}

[tool.setuptools.package-data]
chiketi = ["assets/**/*"]

[tool.ruff.lint.per-file-ignores]
# Imports must follow the sys.path.insert that makes `chiketi` importable.
"scripts/gen_site_assets.py" = ["E402"]
